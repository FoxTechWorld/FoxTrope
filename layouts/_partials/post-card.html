<article class="post-card">
  <div class="post-card__meta">
    <time datetime="{{ .Date.Format `2006-01-02` }}">{{ .Date | time.Format ":date_long" }}</time>
    {{ with .ReadingTime }} · {{ . }} min de leitura{{ end }}
  </div>
  <h2 class="post-card__title"><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
  {{ with .Description | default (.Summary | plainify) }}<p class="post-card__summary">{{ . }}</p>{{ end }}
</article>
